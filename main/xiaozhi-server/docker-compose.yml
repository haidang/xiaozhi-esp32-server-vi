# Docker: chỉ chạy Server (không gồm Admin Console / DB)

version: '3'
services:
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      # Múi giờ Việt Nam (GMT+7)
      - TZ=Asia/Ho_Chi_Minh
    ports:
      # WebSocket thoại — host 8006 → container 8000
      - "8006:8000"
      # Vision — host 8007 → container 8003
      - "8007:8003"
      # OTA (deploy 1 service) — host 8009 → container 8003
      - "8009:8003"
    volumes:
      # Thư mục cấu hình
      - ./data:/opt/xiaozhi-esp32-server/data
      # Mount file model ASR — bắt buộc
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
