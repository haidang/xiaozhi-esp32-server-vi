# Nếu bạn chỉ muốn cài xiaozhi-server dạng nhẹ, dùng cấu hình local thuần,
# có thể bỏ qua file này — không cần sửa gì.
#
# Nếu muốn lấy cấu hình từ manager-api (Admin Console / full module), làm theo các bước:
# 1. Copy file này vào thư mục xiaozhi-server/data (chưa có thì tạo).
# 2. Đổi tên bản copy thành .config.yaml
# 3. Nếu data/ đã có .config.yaml cũ, xóa trước rồi copy lại.
# 4. Khởi động manager-api và manager-web (Admin Console), đăng ký tài khoản;
#    tài khoản đăng ký đầu tiên là admin.
# 5. Đăng nhập admin → trang 【参数管理 / Quản lý tham số】 → tìm 【server.secret】,
#    copy giá trị. Mỗi lần deploy từ đầu, server.secret sẽ đổi.
# 6. Mở data/.config.yaml, đặt manager-api.secret = đúng giá trị server.secret vừa copy.

server:
  ip: 0.0.0.0
  port: 8000
  # Cổng HTTP trong container: API phân tích hình ảnh (vision)
  http_port: 8003
  # Địa chỉ API vision gửi xuống thiết bị
  # Nếu để mặc định kiểu dưới đây, hệ thống tự sinh URL vision và in ra log khi start —
  # bạn có thể mở bằng trình duyệt để kiểm tra.
  # Khi deploy Docker hoặc public (SSL/domain), URL tự sinh có thể không đúng.
  # → Docker / LAN: đặt vision_explain = địa chỉ LAN (vd. http://192.168.x.x:8007/mcp/vision/explain)
  # → Public: đặt vision_explain = địa chỉ công khai
  # Self-Host Server: host Vision map 8007→8003 — xem docs robot-ai
  vision_explain: http://IP-hoặc-domain:cổng/mcp/vision/explain

manager-api:
  # Địa chỉ manager-api. Nên dùng IP LAN hoặc hostname Docker.
  # Deploy Docker full module: bắt buộc dùng
  #   http://xiaozhi-esp32-server-web:8002/xiaozhi
  # (8002 là cổng trong container; không dùng 127.0.0.1 từ trong container server)
  url: http://xiaozhi-esp32-server-web:8002/xiaozhi
  # Token = giá trị server.secret copy từ Admin Console (参数管理)
  secret: dán-server.secret-vào-đây

# File template system prompt mặc định
prompt_template: agent-base-prompt.txt
